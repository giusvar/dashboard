<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoraggio Sensori Temperatura</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: rgba(15, 23, 42, 0.85);
      --surface-2: rgba(30, 41, 59, 0.65);
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
      --radius: 20px;
      --shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.14), transparent 38%),
        radial-gradient(circle at 88% 15%, rgba(129, 140, 248, 0.14), transparent 40%),
        radial-gradient(circle at 50% 95%, rgba(34, 197, 94, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px 56px;
      line-height: 1.5;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
      padding: 24px 28px;
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .brand h1 {
      font-size: clamp(1.4rem, 2.5vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #f8fafc, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.45);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.88rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .toggle-pill input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Summary Strip */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .summary-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .summary-card .label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
    }

    .summary-card .value {
      font-size: 1.65rem;
      font-weight: 700;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .summary-card .sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Sensor Cards */
    .sensors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
    }

    .sensor-card {
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    .sensor-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .sensor-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .sensor-ip {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.84rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 9px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 6px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .badge {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .badge-ok {
      background: rgba(34, 197, 94, 0.14);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.35);
    }

    .badge-err {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.35);
    }

    .badge-classe {
      background: rgba(129, 140, 248, 0.15);
      color: #a5b4fc;
      border-color: rgba(129, 140, 248, 0.35);
    }

    /* Main Temp Display */
    .temp-hero {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .temp-main {
      font-size: clamp(2.4rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .temp-unit {
      font-size: 1.2rem;
      color: var(--muted);
      font-weight: 600;
      margin-left: 4px;
    }

    .temp-side {
      text-align: right;
      font-size: 0.88rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .temp-side strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Fields Grid */
    .fields-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field-box {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .field-key {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .field-val {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.86rem;
      display: none;
    }

    .error-box.visible {
      display: block;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Dashboard Sensori Temperatura</h1>
        <p>Raggruppamento live da <code>192.168.1.110/temp</code> e <code>192.168.1.111/temp</code></p>
      </div>
      <div class="controls" id="controls">
        <label class="toggle-pill" title="Aggiorna automaticamente ogni 15 secondi">
          <input type="checkbox" id="autoRefresh" checked />
          Auto-refresh (15s)
        </label>
        <button class="btn" id="refreshBtn" type="button">
          <span class="spinner"></span>
          Aggiorna ora
        </button>
      </div>
    </header>

    <!-- Riepilogo raggruppato -->
    <section class="summary-grid" aria-label="Riepilogo sensori">
      <div class="summary-card">
        <div class="label">Temperatura Media</div>
        <div class="value" id="avgTemp">--.- °C</div>
        <div class="sub" id="tempRange">Min: --.- °C · Max: --.- °C</div>
      </div>
      <div class="summary-card">
        <div class="label">Sensori Attivi</div>
        <div class="value" id="activeCount">0 / 2</div>
        <div class="sub" id="okStatus">Stato ok: in attesa...</div>
      </div>
      <div class="summary-card">
        <div class="label">Segnale Wi-Fi Medio</div>
        <div class="value" id="avgRssi">-- dBm</div>
        <div class="sub" id="ssidList">SSID: --</div>
      </div>
      <div class="summary-card">
        <div class="label">Ultimo Aggiornamento</div>
        <div class="value" id="lastUpdate">--:--:--</div>
        <div class="sub" id="fetchHint">Lettura diretta JSON locale</div>
      </div>
    </section>

    <!-- Card dei due sensori -->
    <main class="sensors-grid" id="sensorsGrid"></main>
  </div>

  <script>
    const SENSORS = [
      { id: "s1", name: "Sensore 1 Casa - Esterno", url: "http://192.168.1.110/temp", host: "192.168.1.110/temp" },
      { id: "s2", name: "Sensore 2 Tubo Caldaia", url: "http://192.168.1.111/temp", host: "192.168.1.111/temp" }
    ];

    const state = {
      s1: { data: null, error: null, updatedAt: null },
      s2: { data: null, error: null, updatedAt: null }
    };

    const gridEl = document.getElementById("sensorsGrid");
    const refreshBtn = document.getElementById("refreshBtn");
    const autoRefreshEl = document.getElementById("autoRefresh");
    let timerId = null;

    function rssiQuality(rssi) {
      if (typeof rssi !== "number") return "N/D";
      if (rssi >= -50) return "Eccellente";
      if (rssi >= -65) return "Buono";
      if (rssi >= -75) return "Discreto";
      return "Debole";
    }

    function formatNum(val, decimals = 2) {
      return typeof val === "number" && Number.isFinite(val) ? val.toFixed(decimals) : "--";
    }

    function renderCards() {
      gridEl.innerHTML = SENSORS.map((s) => {
        const entry = state[s.id];
        const d = entry.data || {};
        const isOk = Boolean(d.ok) && !entry.error;

        return `
          <article class="sensor-card" id="card-${s.id}">
            <div class="card-top">
              <div>
                <div class="sensor-title">${s.name}</div>
                <div class="sensor-ip">${s.host}</div>
              </div>
              <div class="badges">
                <span class="badge ${isOk ? "badge-ok" : "badge-err"}">
                  ok: ${d.ok !== undefined ? String(d.ok) : "false"}
                </span>
                <span class="badge badge-classe">
                  classe: ${d.classe ?? "--"}
                </span>
              </div>
            </div>

            <div class="temp-hero">
              <div>
                <span class="temp-main">${formatNum(d.temp, 2)}</span>
                <span class="temp-unit">°C</span>
              </div>
              <div class="temp-side">
                <div>Grezza: <strong>${formatNum(d.grezza, 2)} °C</strong></div>
                <div>Offset: <strong>${formatNum(d.offset, 2)} °C</strong></div>
              </div>
            </div>

            <div class="fields-grid">
              <div class="field-box">
                <div class="field-key">temp</div>
                <div class="field-val">${d.temp !== undefined ? `${d.temp} °C` : "--"}</div>
              </div>
              <div class="field-box">
                <div class="field-key">grezza</div>
                <div class="field-val">${d.grezza !== undefined ? `${d.grezza} °C` : "--"}</div>
              </div>
              <div class="field-box">
                <div class="field-key">offset</div>
                <div class="field-val">${d.offset !== undefined ? `${d.offset} °C` : "--"}</div>
              </div>
              <div class="field-box">
                <div class="field-key">classe</div>
                <div class="field-val">${d.classe ?? "--"}</div>
              </div>
              <div class="field-box">
                <div class="field-key">rssi</div>
                <div class="field-val">
                  ${d.rssi !== undefined ? `${d.rssi} dBm` : "--"}
                  <span style="color: var(--muted); font-size: 0.8rem; font-weight: 500;">
                    (${rssiQuality(d.rssi)})
                  </span>
                </div>
              </div>
              <div class="field-box">
                <div class="field-key">ok</div>
                <div class="field-val mono">${d.ok !== undefined ? String(d.ok) : "--"}</div>
              </div>
              <div class="field-box" style="grid-column: 1 / -1;">
                <div class="field-key">ssid</div>
                <div class="field-val mono">${d.ssid ?? "--"}</div>
              </div>
            </div>

            <div class="error-box ${entry.error ? "visible" : ""}">
              ${entry.error ? `Errore lettura: ${entry.error}` : ""}
            </div>

            <div class="card-footer">
              <span>Endpoint: ${s.url}</span>
              <span>Aggiornato: ${entry.updatedAt || "--:--:--"}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderSummary() {
      const validEntries = SENSORS.map((s) => state[s.id]).filter((e) => e.data && !e.error);
      const temps = validEntries
        .map((e) => e.data.temp)
        .filter((t) => typeof t === "number" && Number.isFinite(t));

      const avgTempEl = document.getElementById("avgTemp");
      const tempRangeEl = document.getElementById("tempRange");
      if (temps.length > 0) {
        const avg = temps.reduce((a, b) => a + b, 0) / temps.length;
        const min = Math.min(...temps);
        const max = Math.max(...temps);
        avgTempEl.textContent = `${avg.toFixed(2)} °C`;
        tempRangeEl.textContent = `Min: ${min.toFixed(2)} °C · Max: ${max.toFixed(2)} °C`;
      } else {
        avgTempEl.textContent = "--.- °C";
        tempRangeEl.textContent = "Min: --.- °C · Max: --.- °C";
      }

      const okCount = validEntries.filter((e) => Boolean(e.data.ok)).length;
      document.getElementById("activeCount").textContent = `${validEntries.length} / ${SENSORS.length}`;
      document.getElementById("okStatus").textContent = `Stato ok: ${okCount} su ${SENSORS.length}`;

      const rssis = validEntries
        .map((e) => e.data.rssi)
        .filter((r) => typeof r === "number" && Number.isFinite(r));
      const ssids = [...new Set(validEntries.map((e) => e.data.ssid).filter(Boolean))];

      document.getElementById("avgRssi").textContent =
        rssis.length > 0 ? `${Math.round(rssis.reduce((a, b) => a + b, 0) / rssis.length)} dBm` : "-- dBm";
      document.getElementById("ssidList").textContent =
        ssids.length > 0 ? `SSID: ${ssids.join(", ")}` : "SSID: --";

      const nowTime = new Date().toLocaleTimeString("it-IT");
      document.getElementById("lastUpdate").textContent = validEntries.length > 0 ? nowTime : "--:--:--";
    }

    async function fetchSensor(sensor, timeoutMs = 4000) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(sensor.url, {
          signal: controller.signal,
          cache: "no-store"
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        state[sensor.id] = {
          data: json,
          error: null,
          updatedAt: new Date().toLocaleTimeString("it-IT")
        };
      } catch (err) {
        state[sensor.id] = {
          ...state[sensor.id],
          error: err.name === "AbortError" ? "Timeout di rete" : `${err.message} (verifica CORS / rete locale)`,
          updatedAt: new Date().toLocaleTimeString("it-IT")
        };
      } finally {
        clearTimeout(timeout);
      }
    }

    async function refreshAll() {
      refreshBtn.classList.add("loading");
      await Promise.all(SENSORS.map((s) => fetchSensor(s)));
      renderCards();
      renderSummary();
      refreshBtn.classList.remove("loading");
    }

    function setupAutoRefresh() {
      if (timerId) clearInterval(timerId);
      if (autoRefreshEl.checked) {
        timerId = setInterval(refreshAll, 15000);
      }
    }

    refreshBtn.addEventListener("click", refreshAll);
    autoRefreshEl.addEventListener("change", setupAutoRefresh);

    // Primo rendering immediato e avvio lettura
    renderCards();
    renderSummary();
    refreshAll();
    setupAutoRefresh();
  </script>
</body>
</html>
