<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS ESP32</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --ink: #14202b;
    --muted: #5b6b79;
    --panel: #ffffff;
    --line: #d9e0e6;
    --accent: #0b6bcb;
    --ok: #1f8a4c;
    --warn: #b8741a;
    --bad: #c4352b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #e8edf1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #map { flex: 1; min-height: 0; }

  .status {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 14px; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 1px 4px rgba(20,32,43,.18);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }

  .panel {
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  .main {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .speed { font-size: 64px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .speed small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .dist { text-align: right; }
  .dist b { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dist small { font-size: 16px; color: var(--muted); margin-left: 3px; }
  .dist div { font-size: 13px; color: var(--muted); }

  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    margin: 10px 0 12px;
    text-align: center;
  }
  .grid div { border-top: 1px solid var(--line); padding-top: 5px; }
  .grid span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .grid b { font-size: 15px; font-variant-numeric: tabular-nums; }

  .buttons { display: flex; gap: 8px; }
  button {
    flex: 1; font: inherit; font-size: 16px; font-weight: 600;
    padding: 12px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: #f3f6f8; color: var(--ink);
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button[aria-pressed="true"] { background: #dcebfa; border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; }
  .demo { margin-top: 8px; text-align: center; }
  .demo a { color: var(--muted); font-size: 13px; }
  #msg { font-size: 13px; color: var(--bad); min-height: 16px; margin-top: 6px; }
</style>
</head>
<body>

<div id="map"></div>
<div class="status"><span class="dot" id="dot"></span><span id="statusText">Non connesso</span></div>

<div class="panel">
  <div class="main">
    <div class="speed"><span id="speed">0</span><small>km/h</small></div>
    <div class="dist">
      <div>Percorso</div>
      <b id="dist">0.00</b><small>km</small>
    </div>
  </div>

  <div class="grid">
    <div><span>Massima</span><b id="vmax">0.0</b></div>
    <div><span>Media</span><b id="vavg">0.0</b></div>
    <div><span>Altitudine</span><b id="alt">0</b><small> m</small></div>
    <div><span>Tempo</span><b id="time">00:00:00</b></div>
    <div><span>Satelliti</span><b id="sats">–</b></div>
  </div>

  <div class="buttons">
    <button id="btnConnect" class="primary">Connetti GPS</button>
    <button id="btnFollow" aria-pressed="true">Segui</button>
    <button id="btnReset" class="danger">Reset</button>
  </div>
  <div id="msg" role="status"></div>
  <div class="demo"><a href="#" id="btnDemo">Prova senza ESP32 (simulazione)</a></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function () {
  "use strict";

  var DEVICE_NAME_PREFIX = "GPS-ESP32";
  var SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  var CHAR_UUID    = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; 
  // Nuovo formato riga: lat,lon,velocita_kmh,altitudine,satelliti,fix

  var MIN_STEP_M = 4;      
  var MIN_SPEED_KMH = 1.5; 
  var STORE_KEY = "gpsTrackV2"; // Aggiornato storage key per compatibilità con il nuovo tracciato

  var $ = function (id) { return document.getElementById(id); };
  var elSpeed = $("speed"), elDist = $("dist"), elMax = $("vmax"), elAvg = $("vavg"),
      elAlt = $("alt"), elTime = $("time"), elSats = $("sats"), elMsg = $("msg");

  var map = L.map("map", { zoomControl: false }).setView([44.91, 8.62], 6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);
  L.control.zoom({ position: "topright" }).addTo(map);

  var line = L.polyline([], { color: "#0b6bcb", weight: 5, opacity: 0.9 }).addTo(map);
  var marker = L.circleMarker([0, 0], {
    radius: 8, color: "#fff", weight: 3, fillColor: "#c4352b", fillOpacity: 1
  });
  var follow = true;
  map.on("dragstart", function () { setFollow(false); });

  var points = [];       
  var distM = 0;
  var maxKmh = 0;
  var startTs = null;    
  var device = null, characteristic = null, buffer = "", wantConnected = false;
  var demoTimer = null;
  var wakeLock = null;

  function haversine(a, b) {
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    return pad(Math.floor(sec / 3600)) + ":" + pad(Math.floor(sec / 60) % 60) + ":" + pad(sec % 60);
  }
  function setStatus(text, kind) {
    $("statusText").textContent = text;
    $("dot").className = "dot " + (kind || "");
  }
  function showMsg(t) { elMsg.textContent = t || ""; }
  function setFollow(v) {
    follow = v;
    $("btnFollow").setAttribute("aria-pressed", v ? "true" : "false");
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        points: points, distM: distM, maxKmh: maxKmh, startTs: startTs
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      points = s.points || []; distM = s.distM || 0; maxKmh = s.maxKmh || 0; startTs = s.startTs || null;
      line.setLatLngs(points);
      if (points.length) {
        marker.setLatLng(points[points.length - 1]).addTo(map);
        map.fitBounds(line.getBounds().pad(0.2), { maxZoom: 17 });
      }
    } catch (e) {}
  }

  function render(curKmh) {
    elSpeed.textContent = Math.round(curKmh);
    elDist.textContent = (distM / 1000).toFixed(2);
    elMax.textContent = maxKmh.toFixed(1);
    var elapsed = startTs ? (Date.now() - startTs) / 1000 : 0;
    elTime.textContent = fmtTime(elapsed);
    var avg = elapsed > 0 ? (distM / 1000) / (elapsed / 3600) : 0;
    elAvg.textContent = avg.toFixed(1);
  }
  setInterval(function () { render(Number(elSpeed.textContent) || 0); }, 1000);

  var sinceSave = 0;
  function handleLine(text) {
    var p = text.trim().split(",");
    if (p.length < 6) return; // Aggiornato controllo a 6 elementi
    var lat = parseFloat(p[0]), lon = parseFloat(p[1]),
        kmh = parseFloat(p[2]), alt = parseFloat(p[3]),
        sats = parseInt(p[4], 10), fix = p[5].trim() === "1";

    elSats.textContent = isNaN(sats) ? "–" : sats;
    elAlt.textContent = isNaN(alt) ? "0" : Math.round(alt);

    if (!fix || isNaN(lat) || isNaN(lon)) {
      setStatus("Connesso, in attesa del fix GPS", "warn");
      return;
    }
    setStatus("GPS attivo", "ok");
    if (isNaN(kmh) || kmh < MIN_SPEED_KMH) kmh = 0;

    var pos = [lat, lon];
    if (!marker._map) marker.addTo(map);
    marker.setLatLng(pos);

    var last = points.length ? points[points.length - 1] : null;
    if (!last) {
      points.push(pos);
      line.addLatLng(pos);
      if (!startTs) startTs = Date.now();
      map.setView(pos, 17);
    } else if (kmh > 0) {
      var d = haversine(last, pos);
      if (d >= MIN_STEP_M) {
        distM += d;
        points.push(pos);
        line.addLatLng(pos);
      }
    }
    if (kmh > maxKmh) maxKmh = kmh;
    if (follow) map.panTo(pos, { animate: true });

    render(kmh);
    if (++sinceSave >= 10) { sinceSave = 0; save(); }
  }

  function reset() {
    points = []; distM = 0; maxKmh = 0; startTs = null;
    line.setLatLngs([]);
    elAlt.textContent = "0";
    render(0);
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    showMsg("");
  }

  function onData(ev) {
    var v = ev.target.value;
    buffer += new TextDecoder().decode(v);
    var i;
    while ((i = buffer.indexOf("\n")) >= 0) {
      var l = buffer.slice(0, i);
      buffer = buffer.slice(i + 1);
      if (l) handleLine(l);
    }
    if (buffer.length > 200) buffer = ""; 
  }

  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && (characteristic || demoTimer)) requestWakeLock();
  });

  async function openGatt() {
    setStatus("Connessione in corso…", "warn");
    var server = await device.gatt.connect();
    var service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);
    characteristic.addEventListener("characteristicvaluechanged", onData);
    await characteristic.startNotifications();
    buffer = "";
    setStatus("Connesso, in attesa dati", "warn");
    $("btnConnect").textContent = "Disconnetti";
    requestWakeLock();
  }

  async function connect() {
    showMsg("");
    if (!navigator.bluetooth) {
      showMsg("Web Bluetooth non disponibile: usa Chrome su Android con la pagina in HTTPS.");
      return;
    }
    stopDemo();
    try {
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: DEVICE_NAME_PREFIX }],
        optionalServices: [SERVICE_UUID]
      });
      wantConnected = true;
      device.addEventListener("gattserverdisconnected", onDisconnected);
      await openGatt();
    } catch (e) {
      wantConnected = false;
      setStatus("Non connesso", "");
      if (e && e.name !== "NotFoundError") showMsg("Errore: " + e.message);
    }
  }

  async function onDisconnected() {
    characteristic = null;
    if (!wantConnected) return;
    setStatus("Segnale perso, riconnessione…", "bad");
    for (var n = 0; n < 20 && wantConnected; n++) {
      try {
        await openGatt();
        return;
      } catch (e) {
        await new Promise(function (r) { setTimeout(r, 3000); });
      }
    }
    if (wantConnected) {
      wantConnected = false;
      setStatus("Non connesso", "");
      $("btnConnect").textContent = "Connetti GPS";
      showMsg("Riconnessione non riuscita. Premi Connetti GPS.");
    }
  }

  function disconnect() {
    wantConnected = false;
    if (device && device.gatt.connected) device.gatt.disconnect();
    characteristic = null;
    setStatus("Non connesso", "");
    $("btnConnect").textContent = "Connetti GPS";
  }

  function startDemo() {
    disconnect();
    var lat = 44.9130, lon = 8.6150, heading = 0, t = 0;
    setStatus("Simulazione", "warn");
    requestWakeLock();
    demoTimer = setInterval(function () {
      t++;
      heading += Math.sin(t / 15) * 0.15;
      var kmh = 40 + 15 * Math.sin(t / 10);
      var altSim = 250 + 25 * Math.sin(t / 20); // Simulazione variazione altitudine
      var step = kmh / 3.6 / 111320; 
      lat += Math.cos(heading) * step;
      lon += Math.sin(heading) * step / Math.cos(lat * Math.PI / 180);
      // Invia stringa simulata con altitudine inclusa
      handleLine(lat.toFixed(6) + "," + lon.toFixed(6) + "," + kmh.toFixed(1) + "," + altSim.toFixed(1) + ",8,1");
      setStatus("Simulazione", "warn");
    }, 1000);
  }
  function stopDemo() {
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }

  $("btnConnect").addEventListener("click", function () {
    if (characteristic || wantConnected) disconnect(); else connect();
  });
  $("btnFollow").addEventListener("click", function () {
    setFollow(!follow);
    if (follow && points.length) map.panTo(points[points.length - 1]);
  });
  $("btnReset").addEventListener("click", function () {
    if (!points.length || confirm("Azzerare percorso, distanza e velocità massima?")) reset();
  });
  $("btnDemo").addEventListener("click", function (e) {
    e.preventDefault();
    if (demoTimer) { stopDemo(); setStatus("Non connesso", ""); } else startDemo();
  });

  load();
  render(0);
})();
</script>
</body>
</html>
